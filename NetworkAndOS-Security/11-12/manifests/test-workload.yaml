apiVersion: v1
kind: Namespace
metadata:
  name: demo-workload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo-workload
  labels:
    app: web-frontend
    tier: presentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        tier: presentation
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo-workload
spec:
  selector:
    app: web-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: demo-workload
  labels:
    app: auth-api
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
        tier: application
    spec:
      containers:
      - name: mock-api
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text={\"status\":\"ok\",\"service\":\"auth-api\",\"auth\":\"bearer-token-12345\"}"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: demo-workload
spec:
  selector:
    app: auth-api
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: demo-workload
  labels:
    app: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
      - name: curl-loop
        image: curlimages/curl:8.6.0
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            # 200 OK request to frontend
            curl -s http://web-frontend.demo-workload.svc.cluster.local/ > /dev/null
            # 404 Not Found request to frontend
            curl -s http://web-frontend.demo-workload.svc.cluster.local/missing-page-404 > /dev/null
            # Authenticated REST API request
            curl -s http://auth-api.demo-workload.svc.cluster.local:8080/v1/auth -H "Authorization: Bearer secret-token-123" > /dev/null
            sleep 3
          done

